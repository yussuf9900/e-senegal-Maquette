<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#102c30" />
    <meta
      name="description"
      content="e-Sénégal — une démonstration du guichet numérique citoyen. Vos démarches publiques, plus simples et plus proches."
    />
    <title>e-Sénégal — Vos démarches, simplement.</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="src/css/fonts.css" />
    <link rel="stylesheet" href="src/css/tokens.css" />
    <link rel="stylesheet" href="src/css/base.css" />
    <link rel="stylesheet" href="src/css/components.css" />
    <link rel="stylesheet" href="src/css/pages.css" />
    <link rel="stylesheet" href="src/css/animations.css" />
    <link rel="stylesheet" href="src/css/responsive.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("es-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {}
    </script>
    <script defer src="assets/vendor/gsap.min.js"></script>
    <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
    <script type="module" src="src/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>
    <div id="shell"></div>
    <main id="main" tabindex="-1"></main>
    <div id="footer"></div>
    <div id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="overlay"></div>
    <noscript
      >Cette démonstration nécessite JavaScript pour simuler les
      démarches.</noscript
    >
  </body>
</html>
